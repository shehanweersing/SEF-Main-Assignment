name: travelwise_mobile
description: TravelWise — Smart travel planning mobile app for SE3090.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Routing
  go_router: ^14.8.1

  # JWT decoding (correction #4 — explicit decoder, no custom base64)
  jwt_decoder: ^2.0.1

  # Environment config (BASE_URL read at runtime)
  flutter_dotenv: ^5.2.1

  # Typography
  google_fonts: ^6.2.1

  # JSON serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - .env
